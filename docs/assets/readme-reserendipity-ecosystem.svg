  <!-- ============ Right panel: Governance ============ -->
  <rect x="740" y="140" width="740" height="760" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="764" y="172" font-size="20" font-weight="700" fill="#1f2328">治理结构 · Governance</text>
  <text x="764" y="194" font-size="13" fill="#57606a">单一治理源（ADR-0001）→ 公共条款 → 各仓落地 → 持续校验</text>

  <g font-size="13">
    <rect x="768" y="212" width="684" height="96" rx="10" fill="#ffffff" stroke="#1f883d"/>
    <text x="784" y="236" font-size="14.5" font-weight="700" fill="#1a7f37">.github 仓 · Single source of governance（ADR-0001）</text>
    <text x="784" y="260" fill="#24292f">社区健康文件：CONTRIBUTING · SECURITY · CODE_OF_CONDUCT · Issue/PR 模板</text>
    <text x="784" y="282" fill="#24292f">复用工作流：scorecard（供应链安全） · drift-audit · self-purify · python-quality-baseline</text>

    <line x1="1110" y1="308" x2="1110" y2="336" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="768" y="340" width="684" height="112" rx="10" fill="#ffffff" stroke="#1f883d"/>
    <text x="784" y="364" font-size="14.5" font-weight="700" fill="#1a7f37">governance/ — 政策文档唯一事实来源</text>
    <text x="784" y="388" fill="#24292f">REPOSITORY_GUIDELINES.md（§1–§18 公共条款：命名、分支、发布、许可证、结构收敛等）</text>
    <text x="784" y="410" fill="#24292f">desired-state.json（40+ 登记仓分档） · GOVERNANCE-EXCLUSIONS.md</text>
    <text x="784" y="432" fill="#24292f">decisions/（ADR-0001…0008） · templates/（agent-contract、AGENTS.slim）</text>

    <line x1="1110" y1="452" x2="1110" y2="480" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="768" y="484" width="684" height="112" rx="10" fill="#ffffff" stroke="#0969da"/>
    <text x="784" y="508" font-size="14.5" font-weight="700" fill="#0969da">各项目仓落地 · Per-repo rollout</text>
    <text x="784" y="532" fill="#24292f">docs/agent-contract.md（与模板逐字节一致） · docs/release-governance.md（本地化）</text>
    <text x="784" y="554" fill="#24292f">AGENTS.md 仅存本地、不入库 · 提交身份固定 noreply</text>
    <text x="784" y="576" fill="#24292f">本仓门禁：.github/workflows/ci.yml（check_readme.py + check_public_index.py）</text>

    <line x1="1110" y1="596" x2="1110" y2="624" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="768" y="628" width="684" height="96" rx="10" fill="#ffffff" stroke="#bf8700"/>
    <text x="784" y="652" font-size="14.5" font-weight="700" fill="#9a6700">持续校验 · Continuous checks</text>
    <text x="784" y="676" fill="#24292f">audit-drift（漂移审计） · check-signoff（DCO 签名） · check-governance-consistency</text>
    <text x="784" y="698" fill="#24292f">check-release-standard · check-repo-registry · scaffold-repo · pre-push 模板</text>

    <line x1="1110" y1="724" x2="1110" y2="752" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="768" y="756" width="684" height="112" rx="10" fill="#ffffff" stroke="#cf222e"/>
    <text x="784" y="780" font-size="14.5" font-weight="700" fill="#cf222e">提交红线 · Hard rules（违反即回退）</text>
    <text x="784" y="804" fill="#24292f">git commit -s（DCO） · noreply 身份 · 禁止直推 main（只开 PR） · 禁止 git add -A</text>
    <text x="784" y="826" fill="#24292f">禁止 Force Push / Reset / 移动远端 ref · 禁止改分支保护、Secrets、仓库可见性</text>
    <text x="784" y="848" fill="#24292f">发布链：远端优先、tag 驱动、资产附 SHA256SUMS.txt（本仓暂无发布产物）</text>
  </g>

  <!-- Footer -->
  <text x="750" y="928" text-anchor="middle" font-size="12.5" fill="#6e7781">口径：2026-10-25 经 GitHub API 实况核验；本仓为账号同名主页仓（ReSerendipity），对外内容是静态 Markdown 导航主页，无版本化发布产物。</text>
  <text x="750" y="950" text-anchor="middle" font-size="12.5" fill="#6e7781">Ecosystem &amp; governance overview of the ReSerendipity account — profile-home repo, content-only, no release artifacts.</text>
</svg>
