  <!-- Count cards -->
  <g font-weight="700">
    <rect x="40" y="208" width="210" height="64" rx="10" fill="#ffffff" stroke="#0969da"/>
    <text x="145" y="236" text-anchor="middle" font-size="26" fill="#0969da">19</text>
    <text x="145" y="260" text-anchor="middle" font-size="13.5" fill="#24292f">公开 · 活跃（含主页/治理仓）</text>
    <rect x="262" y="208" width="210" height="64" rx="10" fill="#ffffff" stroke="#6e7781"/>
    <text x="367" y="236" text-anchor="middle" font-size="26" fill="#57606a">8</text>
    <text x="367" y="260" text-anchor="middle" font-size="13.5" fill="#24292f">公开 · 已归档实验</text>
    <rect x="484" y="208" width="210" height="64" rx="10" fill="#ffffff" stroke="#8250df"/>
    <text x="589" y="236" text-anchor="middle" font-size="26" fill="#8250df">20</text>
    <text x="589" y="260" text-anchor="middle" font-size="13.5" fill="#24292f">私有 · 不公开</text>
