  <!-- ============ Right panel: Governance ============ -->
  <rect x="740" y="156" width="740" height="952" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="764" y="190" font-size="24" font-weight="700" fill="#1f2328">治理结构 · Governance</text>
  <text x="764" y="216" font-size="14.5" fill="#57606a">单一治理源（ADR-0001）→ 公共条款 → 各仓落地 → 持续校验 → 提交红线</text>

  <g font-size="14.5">
    <rect x="768" y="232" width="684" height="118" rx="10" fill="#ffffff" stroke="#1f883d"/>
    <text x="784" y="258" font-size="17.5" font-weight="700" fill="#1a7f37">.github 仓 · Single source of governance（ADR-0001）</text>
    <text x="784" y="284" fill="#24292f">社区健康文件：CONTRIBUTING · SECURITY · CODE_OF_CONDUCT · Issue/PR 模板</text>
    <text x="784" y="308" fill="#24292f">复用工作流：scorecard（供应链安全） · drift-audit · self-purify · python-quality-baseline</text>
    <text x="784" y="334" fill="#6e7781">默认社区健康文件入口，供所有公开仓继承</text>

    <line x1="1110" y1="350" x2="1110" y2="378" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="768" y="382" width="684" height="142" rx="10" fill="#ffffff" stroke="#1f883d"/>
    <text x="784" y="408" font-size="17.5" font-weight="700" fill="#1a7f37">governance/ — 政策文档唯一事实来源</text>
    <text x="784" y="434" fill="#24292f">REPOSITORY_GUIDELINES.md（§1–§18 公共条款：命名、分支、发布、许可证、结构收敛等）</text>
    <text x="784" y="458" fill="#24292f">desired-state.json（40+ 登记仓分档） · GOVERNANCE-EXCLUSIONS.md（排除语义）</text>
    <text x="784" y="482" fill="#24292f">decisions/（ADR-0001…0008 决策记录） · templates/（agent-contract、AGENTS.slim）</text>
    <text x="784" y="508" fill="#6e7781">ADR-0001 确立：治理正文只在 .github/governance，仓内副本逐字节一致</text>

    <line x1="1110" y1="524" x2="1110" y2="552" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="768" y="556" width="684" height="142" rx="10" fill="#ffffff" stroke="#0969da"/>
    <text x="784" y="582" font-size="17.5" font-weight="700" fill="#0969da">各项目仓落地 · Per-repo rollout</text>
    <text x="784" y="608" fill="#24292f">docs/agent-contract.md（与模板逐字节一致） · docs/release-governance.md（本地化）</text>
    <text x="784" y="632" fill="#24292f">AGENTS.md 仅存本地、不入库 · 提交身份固定 noreply · git commit -s（DCO）</text>
    <text x="784" y="656" fill="#24292f">本仓门禁：.github/workflows/ci.yml（check_readme.py + check_public_index.py）</text>
    <text x="784" y="682" fill="#6e7781">本仓为内容型主页仓：无版本位、无发布产物，发布链待需要时再建</text>

    <line x1="1110" y1="698" x2="1110" y2="726" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="768" y="730" width="684" height="118" rx="10" fill="#ffffff" stroke="#bf8700"/>
    <text x="784" y="756" font-size="17.5" font-weight="700" fill="#9a6700">持续校验 · Continuous checks</text>
    <text x="784" y="782" fill="#24292f">audit-drift（漂移审计） · check-signoff（DCO 签名） · check-governance-consistency</text>
    <text x="784" y="806" fill="#24292f">check-release-standard · check-repo-registry · scaffold-repo · pre-push 模板</text>
    <text x="784" y="832" fill="#6e7781">.github 仓 workflow：drift-audit · self-purify · scorecard · python-quality-baseline</text>

    <line x1="1110" y1="848" x2="1110" y2="876" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="768" y="880" width="684" height="210" rx="10" fill="#ffffff" stroke="#cf222e"/>
    <text x="784" y="906" font-size="17.5" font-weight="700" fill="#cf222e">提交红线 · Hard rules（违反即回退）</text>
    <text x="784" y="932" fill="#24292f">git commit -s（DCO） · noreply 身份 · 禁止直推 main（只开 PR） · 禁止 git add -A</text>
    <text x="784" y="956" fill="#24292f">禁止 Force Push / Reset / 移动远端 ref · 禁止改分支保护、Secrets、仓库可见性</text>
    <text x="784" y="980" fill="#24292f">发布链：远端优先、tag 驱动、资产附 SHA256SUMS.txt（本仓暂无发布产物）</text>
    <text x="784" y="1008" fill="#6e7781">工作流：本地只改版本位、落 CHANGELOG、打 tag；构建/打包/上传全部在 Actions 远端完成</text>
    <text x="784" y="1036" fill="#6e7781">回滚：git revert 保历史、可再 forward；重定向/删除 tag 需账号所有者单独授权</text>
    <text x="784" y="1064" fill="#6e7781">本仓无 tag、无 Release、无 CI 红灯的基线：任何操作前先跑两条 README 门禁脚本</text>
  </g>

  <!-- Footer -->
  <text x="750" y="1132" text-anchor="middle" font-size="14" fill="#6e7781">口径：2026-10-25 经 GitHub API 实况核验；本仓为账号同名主页仓（ReSerendipity），对外内容是静态 Markdown 导航主页，无版本化发布产物。</text>
