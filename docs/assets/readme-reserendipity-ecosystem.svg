  <text x="56" y="462" font-size="12.5" fill="#24292f">DraftPeek（原生编辑器） · GalgameShell（Galgame 运行外壳）</text>

  <rect x="40" y="492" width="654" height="88" rx="10" fill="#ffffff" stroke="#d0d7de"/>
